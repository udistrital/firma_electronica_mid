swagger: '2.0'
basePath: /api/v1
paths:
  /firma_electronica:
    post:
      responses:
        '200':
          description: Success
      summary: Permite firmar un documento y subirlo a nuxeo consumiendo a gestor
        documental
      description: "Parameters\n----------\nrequest : json\n    Json Body {Document},\
        \ Documento que será firmado\n\nReturns\n-------\nResponse\n    Respuesta\
        \ con cuerpo, status y en formato json"
      operationId: post_firma_electronica_resource
      parameters:
      - name: payload
        required: true
        in: body
        schema:
          type: array
          items:
            $ref: '#/definitions/upload_resquest'
      tags:
      - v1
  /firma_multiple:
    post:
      responses:
        '200':
          description: Success
      summary: Permite realizar firma múltiple asincrónica utilizando como pámetro
        para decidir la etapa en la que se está firmando la clave valor etapa_firma
      description: "Parameters\n----------\nrequest : json\n    Json Body {Document},\
        \ Documento que será firmado\n\nReturns\n-------\nResponse\n    Respuesta\
        \ con cuerpo, status y en formato json"
      operationId: post_firma_multiple_resource
      parameters:
      - name: payload
        required: true
        in: body
        schema:
          type: array
          items:
            $ref: '#/definitions/upload_resquest'
      tags:
      - v1
  /qr/file:
    post:
      responses:
        '200':
          description: Success
      summary: Retorna el archivo del documento validado a partir del token QR
      operationId: post_secure_qr_file_resource
      parameters:
      - name: payload
        required: true
        in: body
        schema:
          $ref: '#/definitions/qr_token_request'
      tags:
      - v1
  /qr/resolve:
    post:
      responses:
        '200':
          description: Success
      summary: Resuelve un token QR validado y retorna datos del documento para el
        cliente
      operationId: post_secure_qr_resolve_resource
      parameters:
      - name: payload
        required: true
        in: body
        schema:
          $ref: '#/definitions/qr_token_request'
      tags:
      - v1
  /qr:
    post:
      responses:
        '200':
          description: Success
      summary: Redirige al cliente de verificación a partir de un token QR firmado
      operationId: post_secure_qr_resource
      parameters:
      - name: payload
        required: true
        in: body
        schema:
          $ref: '#/definitions/qr_token_request'
      tags:
      - v1
  /verify:
    post:
      responses:
        '200':
          description: Success
      summary: Permite verificar la firma electronica de un documento
      description: "Parameters\n----------\nrequest : json\n    Json Body {firma},\
        \ firma electronica encriptada con el id\n\nReturns\n-------\nResponse\n \
        \   Respuesta con cuerpo, status y en formato json"
      operationId: post_verify_firma_resource
      parameters:
      - name: payload
        required: true
        in: body
        schema:
          type: array
          items:
            $ref: '#/definitions/firma_request'
      tags:
      - v1
info:
  title: firma_electronica_mid
  version: '1.0'
  description: API para la firma electrónica de documentos
produces:
- application/json
consumes:
- application/json
tags:
- name: v1
  description: Servicios de firma electrónica
definitions:
  upload_resquest:
    properties:
      IdTipoDocumento:
        type: integer
      nombre:
        type: string
      metadatos:
        $ref: '#/definitions/documentos_crud_metadata'
      firmantes:
        type: array
        items:
          $ref: '#/definitions/firmantes_info'
      representantes:
        type: array
        items:
          $ref: '#/definitions/representantes_info'
      descripcion:
        type: string
      etapa_firma:
        type: integer
      file:
        type: string
    type: object
  documentos_crud_metadata:
    properties:
      dato_a:
        type: string
      dato_b:
        type: string
      dato_n:
        type: string
    type: object
  firmantes_info:
    properties:
      nombre:
        type: string
      cargo:
        type: string
      tipoId:
        type: string
      identificacion:
        type: string
    type: object
  representantes_info:
    properties:
      nombre:
        type: string
      cargo:
        type: string
      tipoId:
        type: string
      identificacion:
        type: string
    type: object
  firma_request:
    properties:
      firma:
        type: string
      fileUp:
        description: Acepta string, lista u objeto para compatibilidad con consumidores
      urlFileUp:
        description: Acepta string, lista u objeto para compatibilidad con consumidores
    type: object
  qr_token_request:
    properties:
      token:
        type: string
    type: object
responses:
  ParseError:
    description: When a mask can't be parsed
  MaskError:
    description: When any error occurs on mask
